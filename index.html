<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acoustic AirDrop</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #0d1117;
      color: #58a6ff;
      font-family: monospace;
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h2 { color: #f0f6fc; margin: 10px 0; }
    #status { color: #8b949e; margin-bottom: 10px; font-size: 13px; text-align: center; }
    
    #meter-container {
      width: 100%;
      max-width: 400px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 15px;
      display: none;
    }
    .meter-label { font-size: 11px; color: #8b949e; margin-bottom: 4px; }
    .bar-bg { background: #21262d; height: 12px; border-radius: 6px; overflow: hidden; }
    #signal-bar { width: 0%; height: 100%; background: #3fb950; transition: width 0.05s; }

    #startBtn {
      background: #238636;
      color: #fff;
      border: none;
      padding: 15px 30px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      margin-bottom: 15px;
    }
    #chat-container {
      width: 100%;
      max-width: 400px;
      display: none;
      flex-direction: column;
      gap: 10px;
    }
    #chatbox {
      width: 100%;
      height: 260px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg { padding: 8px 12px; border-radius: 6px; max-width: 85%; word-break: break-all; }
    .incoming { background: #21262d; color: #3fb950; align-self: flex-start; }
    .outgoing { background: #1f6feb; color: #ffffff; align-self: flex-end; }
    .debug-msg { font-size: 11px; color: #8b949e; align-self: center; }
    .input-row { display: flex; gap: 8px; }
    input {
      flex: 1;
      background: #0d1117;
      border: 1px solid #30363d;
      color: #fff;
      padding: 12px;
      border-radius: 6px;
      font-family: monospace;
    }
    #sendBtn {
      background: #1f6feb;
      color: #fff;
      border: none;
      padding: 0 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>ACOUSTIC AIRDROP</h2>
  <div id="status">Standby: Tap Start to initialize</div>
  <button id="startBtn" onclick="initAudio()">START AIRDROP</button>

  <div id="meter-container">
    <div class="meter-label">Live Ultrasonic Signal Power:</div>
    <div class="bar-bg"><div id="signal-bar"></div></div>
  </div>

  <div id="chat-container">
    <div id="chatbox"></div>
    <div class="input-row">
      <input id="textInput" type="text" placeholder="Type message (e.g. hi)..." />
      <button id="sendBtn" onclick="sendMessage()">SEND</button>
    </div>
  </div>

  <script>
    // Ultrasonic Band (17.2 kHz - 19.6 kHz: completely silent to adults)
    const FREQ_SYNC = 17200;
    const FREQ_0    = 18000;
    const FREQ_1    = 18800;
    const FREQ_STOP = 19600;

    const TONE_MS   = 60;      // 60ms tone burst
    const GAP_MS    = 30;      // 30ms silence gap (kills room echo)
    const BIT_MS    = TONE_MS + GAP_MS; // 90ms total per bit
    const SYNC_MS   = 350;     // Wake-up carrier tone
    const STOP_MS   = 200;     // Unmistakable stop tone

    let audioCtx, analyser, dataArray;
    let state = "IDLE";
    let isTransmitting = false;

    async function initAudio() {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
        if (audioCtx.state === 'suspended') await audioCtx.resume();

        const stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false
          }
        });

        const source = audioCtx.createMediaStreamSource(stream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;
        source.connect(analyser);

        dataArray = new Uint8Array(analyser.frequencyBinCount);

        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('meter-container').style.display = 'block';
        document.getElementById('chat-container').style.display = 'flex';
        document.getElementById('status').innerText = "Status: Listening silently...";

        requestAnimationFrame(updateLoop);
      } catch (err) {
        alert("Audio Init Error: " + err.message);
      }
    }

    function getMag(freq) {
      const nyquist = audioCtx.sampleRate / 2;
      const bin = Math.round((freq / nyquist) * analyser.frequencyBinCount);
      return (dataArray[bin - 1] + dataArray[bin] + dataArray[bin + 1]) / 3;
    }

    let rxStartTime = 0;
    let rxBits = [];
    let lastSampledIndex = -1;
    let noise0 = 0, noise1 = 0;

    function updateLoop() {
      analyser.getByteFrequencyData(dataArray);

      const syncMag = getMag(FREQ_SYNC);
      const mag0    = getMag(FREQ_0);
      const mag1    = getMag(FREQ_1);
      const stopMag = getMag(FREQ_STOP);
      const maxPower = Math.max(syncMag, mag0, mag1, stopMag);

      const bar = document.getElementById('signal-bar');
      bar.style.width = isTransmitting ? "0%" : Math.min(100, (maxPower / 120) * 100) + "%";

      const now = performance.now();

      if (!isTransmitting) {
        if (state === "IDLE") {
          // Detect SYNC tone clearly above data frequencies
          if (syncMag > 35 && syncMag > (mag0 + 10) && syncMag > (mag1 + 10)) {
            state = "SYNCED";
            document.getElementById('status').innerText = "Status: Incoming transmission detected...";
            
            noise0 = mag0;
            noise1 = mag1;
            rxBits = [];
            lastSampledIndex = -1;

            // Wait out SYNC tone + 40ms silence guard
            rxStartTime = now + SYNC_MS + 40;
            state = "RECEIVING";
          }
        } else if (state === "RECEIVING") {
          if (now >= rxStartTime) {
            // Check for STOP tone
            if (stopMag > 30 && stopMag > (mag0 + 5) && stopMag > (mag1 + 5)) {
              finishReceive();
              requestAnimationFrame(updateLoop);
              return;
            }

            const elapsed = now - rxStartTime;
            const bitIndex = Math.floor(elapsed / BIT_MS);

            // Jitter-proof sampling: samples exactly once per bit index
            if (bitIndex > lastSampledIndex) {
              lastSampledIndex = bitIndex;

              const delta0 = getMag(FREQ_0) - noise0;
              const delta1 = getMag(FREQ_1) - noise1;

              rxBits.push(delta1 > delta0 ? 1 : 0);

              // Auto-finish after 80 bits (10 characters max safety)
              if (rxBits.length >= 80) {
                finishReceive();
              }
            }
          }
        }
      }

      requestAnimationFrame(updateLoop);
    }

    function finishReceive() {
      state = "IDLE";
      document.getElementById('status').innerText = "Status: Listening silently...";

      if (rxBits.length < 8) return; // Too short to be a valid letter

      let binStr = rxBits.join('');
      let text = "";
      for (let i = 0; i + 8 <= binStr.length; i += 8) {
        let byte = binStr.substr(i, 8);
        let code = parseInt(byte, 2);
        // Printable ASCII characters
        if (code >= 32 && code <= 126) {
          text += String.fromCharCode(code);
        }
      }

      if (text.length > 0) {
        appendChat(text, 'incoming');
      } else {
        appendChat(`[Received ${rxBits.length} bits, but noise detected]`, 'debug-msg');
      }
      rxBits = [];
    }

    function appendChat(text, type) {
      const box = document.getElementById('chatbox');
      const div = document.createElement('div');
      div.className = `msg ${type}`;
      div.innerText = (type === 'outgoing' ? 'You: ' : (type === 'incoming' ? 'Remote: ' : '')) + text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    // --- TRANSMITTER ---
    function sendMessage() {
      const input = document.getElementById('textInput');
      const text = input.value.trim();
      if (!text || isTransmitting) return;

      input.value = "";
      appendChat(text, 'outgoing');
      isTransmitting = true;
      document.getElementById('status').innerText = "Status: Transmitting silently...";

      let bits = [];
      for (let i = 0; i < text.length; i++) {
        let b = text.charCodeAt(i).toString(2).padStart(8, '0');
        for (let char of b) bits.push(parseInt(char));
      }

      const sampleRate = audioCtx.sampleRate;
      const syncSamples = Math.floor(sampleRate * (SYNC_MS / 1000));
      const toneSamples = Math.floor(sampleRate * (TONE_MS / 1000));
      const gapSamples  = Math.floor(sampleRate * (GAP_MS / 1000));
      const stopSamples = Math.floor(sampleRate * (STOP_MS / 1000));
      const postSyncGap = Math.floor(sampleRate * (0.04));

      const totalSamples = syncSamples + postSyncGap + (bits.length * (toneSamples + gapSamples)) + stopSamples;
      const buffer = audioCtx.createBuffer(1, totalSamples, sampleRate);
      const data = buffer.getChannelData(0);

      let offset = 0;
      function appendTone(freq, numSamples) {
        const ramp = Math.min(80, Math.floor(numSamples * 0.12));
        for (let i = 0; i < numSamples; i++) {
          let env = 1;
          if (i < ramp) env = 0.5 * (1 - Math.cos((Math.PI * i) / ramp));
          else if (i > numSamples - ramp) env = 0.5 * (1 - Math.cos((Math.PI * (numSamples - i)) / ramp));
          // Clean 0.65 gain to keep phone speakers crisp without clipping
          data[offset + i] = 0.65 * env * Math.sin(2 * Math.PI * freq * (i / sampleRate));
        }
        offset += numSamples;
      }

      function appendSilence(numSamples) {
        offset += numSamples;
      }

      // 1. Play Sync Tone + 40ms silence
      appendTone(FREQ_SYNC, syncSamples);
      appendSilence(postSyncGap);

      // 2. Play each data bit with 30ms guard gaps
      for (let bit of bits) {
        appendTone(bit === 1 ? FREQ_1 : FREQ_0, toneSamples);
        appendSilence(gapSamples);
      }

      // 3. Play Stop Tone
      appendTone(FREQ_STOP, stopSamples);

      const source = audioCtx.createBufferSource();
      source.buffer = buffer;
      source.connect(audioCtx.destination);
      source.start();

      source.onended = () => {
        setTimeout(() => {
          isTransmitting = false;
          document.getElementById('status').innerText = "Status: Listening silently...";
        }, 200);
      };
    }
  </script>
</body>
</html>
