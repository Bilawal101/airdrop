<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acoustic AirDrop (Near-Ultrasound)</title>
  <!-- Official ggwave WASM bundle -->
  <script src="https://cdn.jsdelivr.net/npm/ggwave@0.4.0/ggwave.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #0d1117;
      color: #58a6ff;
      font-family: monospace;
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h2 { color: #f0f6fc; margin: 10px 0; }
    #status { color: #8b949e; margin-bottom: 12px; font-size: 13px; text-align: center; }
    
    #startBtn {
      background: #238636;
      color: #fff;
      border: none;
      padding: 15px 30px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      margin-bottom: 15px;
    }

    #chat-container {
      width: 100%;
      max-width: 420px;
      display: none;
      flex-direction: column;
      gap: 10px;
    }
    #chatbox {
      width: 100%;
      height: 280px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg { padding: 8px 12px; border-radius: 6px; max-width: 85%; font-size: 14px; word-break: break-all; }
    .incoming { background: #21262d; color: #3fb950; align-self: flex-start; }
    .outgoing { background: #1f6feb; color: #ffffff; align-self: flex-end; }
    
    .input-row { display: flex; gap: 8px; }
    input {
      flex: 1;
      background: #0d1117;
      border: 1px solid #30363d;
      color: #fff;
      padding: 12px;
      border-radius: 6px;
      font-family: monospace;
    }
    #sendBtn {
      background: #1f6feb;
      color: #fff;
      border: none;
      padding: 0 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    #sendBtn:disabled { background: #30363d; cursor: not-allowed; }
  </style>
</head>
<body>

  <h2>ACOUSTIC AIRDROP</h2>
  <div id="status">Standby: Tap Start to initialize</div>
  <button id="startBtn" onclick="initAcousticChat()">START CHAT</button>

  <div id="chat-container">
    <div id="chatbox"></div>
    <div class="input-row">
      <input id="textInput" type="text" placeholder="Type message..." onkeydown="if(event.key==='Enter') sendMessage()" />
      <button id="sendBtn" onclick="sendMessage()">SEND</button>
    </div>
  </div>

  <script>
    let ggwave = null;
    let instance = null;
    let audioCtx = null;
    let isTransmitting = false;

    // Protocol 4 = Ultrasound Fast (~15.5 kHz - 17 kHz: virtually inaudible & reliable)
    // Protocol 1 = Audible Fast (use for testing if speakers don't support near-ultrasound)
    const PROTOCOL_ULTRASOUND_FAST = 4;

    async function initAcousticChat() {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass({ sampleRate: 48000 });
        if (audioCtx.state === 'suspended') await audioCtx.resume();

        // 1. Initialize WASM module
        ggwave = await ggwave_factory();

        // 2. Configure engine parameters
        const parameters = ggwave.getDefaultParameters();
        parameters.sampleRateInp = audioCtx.sampleRate;
        parameters.sampleRateOut = audioCtx.sampleRate;
        instance = ggwave.init(parameters);

        // 3. Obtain microphone with browser DSP filters turned off
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: false,
            autoGainControl: false,
            noiseSuppression: false
          }
        });

        // 4. Capture pipeline
        const source = audioCtx.createMediaStreamSource(stream);
        const recorder = audioCtx.createScriptProcessor(1024, 1, 1);

        recorder.onaudioprocess = (e) => {
          if (isTransmitting || !instance) return;
          const inputData = e.inputBuffer.getChannelData(0);

          // Feed float audio samples to the decoder
          const res = ggwave.decode(instance, inputData);
          if (res && res.length > 0) {
            appendChat(res, 'incoming');
          }
        };

        source.connect(recorder);
        recorder.connect(audioCtx.destination);

        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('chat-container').style.display = 'flex';
        document.getElementById('status').innerText = "Status: Listening (Near-Ultrasound band)...";
      } catch (err) {
        document.getElementById('status').innerText = "Error: " + err.message;
        alert("Audio Init Error: " + err.message);
        console.error(err);
      }
    }

    function sendMessage() {
      const input = document.getElementById('textInput');
      const text = input.value.trim();
      if (!text || isTransmitting || !instance) return;

      input.value = "";
      appendChat(text, 'outgoing');
      
      const sendBtn = document.getElementById('sendBtn');
      sendBtn.disabled = true;
      isTransmitting = true;
      document.getElementById('status').innerText = "Status: Transmitting silently...";

      try {
        // Encode text into raw 16-bit PCM waveform using Ultrasound Fast (protocol 4)
        const volume = 30; // 0 - 100
        const waveform = ggwave.encode(instance, text, PROTOCOL_ULTRASOUND_FAST, volume);

        if (!waveform || waveform.length === 0) {
          throw new Error("ggwave failed to encode the string");
        }

        // Convert byte buffer to 16-bit signed PCM, then normalize to [-1.0, 1.0] Float32
        const int16View = new Int16Array(waveform.buffer, waveform.byteOffset, waveform.length / 2);
        const floatData = new Float32Array(int16View.length);
        for (let i = 0; i < int16View.length; i++) {
          floatData[i] = int16View[i] / 32768.0;
        }

        // Play waveform buffer through device speakers
        const audioBuffer = audioCtx.createBuffer(1, floatData.length, audioCtx.sampleRate);
        audioBuffer.getChannelData(0).set(floatData);

        const source = audioCtx.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(audioCtx.destination);

        source.onended = () => {
          setTimeout(() => {
            isTransmitting = false;
            sendBtn.disabled = false;
            document.getElementById('status').innerText = "Status: Listening (Near-Ultrasound band)...";
          }, 200);
        };

        source.start();
      } catch (err) {
        console.error("Transmission error:", err);
        document.getElementById('status').innerText = "Send Error: " + err.message;
        isTransmitting = false;
        sendBtn.disabled = false;
      }
    }

    function appendChat(text, type) {
      const box = document.getElementById('chatbox');
      const div = document.createElement('div');
      div.className = `msg ${type}`;
      div.innerText = (type === 'outgoing' ? 'You: ' : 'Remote: ') + text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }
  </script>
</body>
</html>
