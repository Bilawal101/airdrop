<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acoustic AirDrop</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #0d1117;
      color: #58a6ff;
      font-family: monospace;
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h2 { color: #f0f6fc; margin: 10px 0; }
    #status { color: #8b949e; margin-bottom: 10px; font-size: 13px; text-align: center; }
    
    #meter-container {
      width: 100%;
      max-width: 400px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 15px;
      display: none;
    }
    .meter-label { font-size: 11px; color: #8b949e; margin-bottom: 4px; }
    .bar-bg { background: #21262d; height: 12px; border-radius: 6px; overflow: hidden; }
    #signal-bar { width: 0%; height: 100%; background: #3fb950; transition: width 0.05s; }

    #startBtn {
      background: #238636;
      color: #fff;
      border: none;
      padding: 15px 30px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      margin-bottom: 15px;
    }
    #chat-container {
      width: 100%;
      max-width: 400px;
      display: none;
      flex-direction: column;
      gap: 10px;
    }
    #chatbox {
      width: 100%;
      height: 260px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg { padding: 8px 12px; border-radius: 6px; max-width: 80%; word-break: break-all; }
    .incoming { background: #21262d; color: #3fb950; align-self: flex-start; }
    .outgoing { background: #1f6feb; color: #ffffff; align-self: flex-end; }
    .input-row { display: flex; gap: 8px; }
    input {
      flex: 1;
      background: #0d1117;
      border: 1px solid #30363d;
      color: #fff;
      padding: 12px;
      border-radius: 6px;
      font-family: monospace;
    }
    #sendBtn {
      background: #1f6feb;
      color: #fff;
      border: none;
      padding: 0 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>ACOUSTIC AIRDROP</h2>
  <div id="status">Standby: Tap Start to initialize</div>
  <button id="startBtn" onclick="initAudio()">START AIRDROP</button>

  <div id="meter-container">
    <div class="meter-label">Live Ultrasonic Signal Power:</div>
    <div class="bar-bg"><div id="signal-bar"></div></div>
  </div>

  <div id="chat-container">
    <div id="chatbox"></div>
    <div class="input-row">
      <input id="textInput" type="text" placeholder="Type message (e.g. hi)..." />
      <button id="sendBtn" onclick="sendMessage()">SEND</button>
    </div>
  </div>

  <script>
    // Ultrasonic Frequencies
    const FREQ_SYNC = 16000;
    const FREQ_0    = 16900;
    const FREQ_1    = 17900;

    const TONE_MS   = 65;      // 65ms tone
    const GAP_MS    = 30;      // 30ms guard silence
    const BIT_MS    = TONE_MS + GAP_MS; // 95ms per bit
    const SYNC_MS   = 350;     // Wake-up carrier

    let audioCtx, analyser, dataArray;
    let state = "IDLE";
    let isTransmitting = false;

    async function initAudio() {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
        if (audioCtx.state === 'suspended') await audioCtx.resume();

        const stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false
          }
        });

        const source = audioCtx.createMediaStreamSource(stream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;
        source.connect(analyser);

        dataArray = new Uint8Array(analyser.frequencyBinCount);

        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('meter-container').style.display = 'block';
        document.getElementById('chat-container').style.display = 'flex';
        document.getElementById('status').innerText = "Status: Listening silently...";

        requestAnimationFrame(updateLoop);
      } catch (err) {
        alert("Audio Init Error: " + err.message);
      }
    }

    function getMag(freq) {
      const nyquist = audioCtx.sampleRate / 2;
      const bin = Math.round((freq / nyquist) * analyser.frequencyBinCount);
      return (dataArray[bin - 1] + dataArray[bin] + dataArray[bin + 1]) / 3;
    }

    let rxStartTime = 0;
    let totalBitsToReceive = 0;
    let rxBits = [];
    let lastSampledIndex = -1;
    let noise0 = 0, noise1 = 0;

    function updateLoop() {
      analyser.getByteFrequencyData(dataArray);

      const syncMag = getMag(FREQ_SYNC);
      const mag0    = getMag(FREQ_0);
      const mag1    = getMag(FREQ_1);
      const maxPower = Math.max(syncMag, mag0, mag1);

      const bar = document.getElementById('signal-bar');
      bar.style.width = isTransmitting ? "0%" : Math.min(100, (maxPower / 130) * 100) + "%";

      const now = performance.now();

      if (!isTransmitting) {
        if (state === "IDLE") {
          // Detect SYNC tone
          if (syncMag > 45 && syncMag > (mag0 + 15) && syncMag > (mag1 + 15)) {
            state = "SYNCED";
            document.getElementById('status').innerText = "Status: Receiving incoming transmission...";
            
            // Measure baseline background noise
            noise0 = mag0;
            noise1 = mag1;
            rxBits = [];
            lastSampledIndex = -1;
            totalBitsToReceive = 0; // will be determined by 6-bit length header

            // Schedule start right after SYNC + guard gap
            rxStartTime = now + SYNC_MS + 40;
            state = "RECEIVING";
          }
        } else if (state === "RECEIVING") {
          if (now >= rxStartTime) {
            const elapsed = now - rxStartTime;
            const bitIndex = Math.floor(elapsed / BIT_MS);
            const timeInWindow = elapsed % BIT_MS;

            // Sample at the center of the tone window (between 25ms and 50ms)
            if (bitIndex > lastSampledIndex && timeInWindow >= 25 && timeInWindow <= 55) {
              lastSampledIndex = bitIndex;

              // Normalized delta to compensate for speaker roll-off
              const delta0 = getMag(FREQ_0) - noise0;
              const delta1 = (getMag(FREQ_1) - noise1) * 1.3; // 1.3x boost for higher freq

              rxBits.push(delta1 > delta0 ? 1 : 0);

              // Once first 6 bits arrive, read the packet length!
              if (rxBits.length === 6 && totalBitsToReceive === 0) {
                const charCount = parseInt(rxBits.join(''), 2);
                if (charCount > 0 && charCount <= 30) {
                  totalBitsToReceive = 6 + (charCount * 8);
                } else {
                  // Corrupt header fallback
                  resetReceiver();
                }
              }

              // Finished packet!
              if (totalBitsToReceive > 0 && rxBits.length >= totalBitsToReceive) {
                finishReceive();
              }
            }

            // Safety timeout after 10 seconds
            if (elapsed > 10000) {
              resetReceiver();
            }
          }
        }
      }

      requestAnimationFrame(updateLoop);
    }

    function resetReceiver() {
      state = "IDLE";
      document.getElementById('status').innerText = "Status: Listening silently...";
    }

    function finishReceive() {
      state = "IDLE";
      document.getElementById('status').innerText = "Status: Listening silently...";

      const payloadBits = rxBits.slice(6); // Skip the 6-bit length header
      let text = "";
      for (let i = 0; i + 8 <= payloadBits.length; i += 8) {
        let byte = payloadBits.slice(i, i + 8).join('');
        text += String.fromCharCode(parseInt(byte, 2));
      }

      if (text.length > 0) {
        appendChat(text, 'incoming');
      }
    }

    function appendChat(text, type) {
      const box = document.getElementById('chatbox');
      const div = document.createElement('div');
      div.className = `msg ${type}`;
      div.innerText = (type === 'outgoing' ? 'You: ' : 'Remote: ') + text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    // --- TRANSMITTER ---
    function sendMessage() {
      const input = document.getElementById('textInput');
      const text = input.value.trim();
      if (!text || isTransmitting) return;

      input.value = "";
      appendChat(text, 'outgoing');
      isTransmitting = true;
      document.getElementById('status').innerText = "Status: Transmitting silently...";

      // 1. First 6 bits: message length
      let bits = [];
      const lenBinary = text.length.toString(2).padStart(6, '0');
      for (let b of lenBinary) bits.push(parseInt(b));

      // 2. Data bits
      for (let i = 0; i < text.length; i++) {
        let b = text.charCodeAt(i).toString(2).padStart(8, '0');
        for (let char of b) bits.push(parseInt(char));
      }

      const sampleRate = audioCtx.sampleRate;
      const syncSamples = Math.floor(sampleRate * (SYNC_MS / 1000));
      const toneSamples = Math.floor(sampleRate * (TONE_MS / 1000));
      const gapSamples  = Math.floor(sampleRate * (GAP_MS / 1000));
      const postSyncGap = Math.floor(sampleRate * (0.04));

      const totalSamples = syncSamples + postSyncGap + (bits.length * (toneSamples + gapSamples));
      const buffer = audioCtx.createBuffer(1, totalSamples, sampleRate);
      const data = buffer.getChannelData(0);

      let offset = 0;
      function appendTone(freq, numSamples, volumeMultiplier = 1.0) {
        const ramp = Math.min(100, Math.floor(numSamples * 0.15)); // smooth cosine taper
        for (let i = 0; i < numSamples; i++) {
          let env = 1;
          if (i < ramp) env = 0.5 * (1 - Math.cos((Math.PI * i) / ramp));
          else if (i > numSamples - ramp) env = 0.5 * (1 - Math.cos((Math.PI * (numSamples - i)) / ramp));
          data[offset + i] = 0.85 * volumeMultiplier * env * Math.sin(2 * Math.PI * freq * (i / sampleRate));
        }
        offset += numSamples;
      }

      function appendSilence(numSamples) {
        offset += numSamples;
      }

      // Play Sync Tone + 40ms silence
      appendTone(FREQ_SYNC, syncSamples, 1.0);
      appendSilence(postSyncGap);

      // Play all bits with frequency equalization (boost FREQ_1 by 1.25x for speaker drop-off)
      for (let bit of bits) {
        if (bit === 1) {
          appendTone(FREQ_1, toneSamples, 1.25);
        } else {
          appendTone(FREQ_0, toneSamples, 0.95);
        }
        appendSilence(gapSamples);
      }

      const source = audioCtx.createBufferSource();
      source.buffer = buffer;
      source.connect(audioCtx.destination);
      source.start();

      source.onended = () => {
        setTimeout(() => {
          isTransmitting = false;
          document.getElementById('status').innerText = "Status: Listening silently...";
        }, 200);
      };
    }
  </script>
</body>
</html>
