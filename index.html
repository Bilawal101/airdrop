<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acoustic AirDrop</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #0d1117;
      color: #58a6ff;
      font-family: monospace;
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h2 { color: #f0f6fc; margin: 10px 0; }
    #status { color: #8b949e; margin-bottom: 10px; font-size: 13px; text-align: center; }
    
    #meter-container {
      width: 100%;
      max-width: 400px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 15px;
      display: none;
    }
    .meter-label { font-size: 11px; color: #8b949e; margin-bottom: 4px; }
    .bar-bg { background: #21262d; height: 12px; border-radius: 6px; overflow: hidden; }
    #signal-bar { width: 0%; height: 100%; background: #3fb950; transition: width 0.05s; }

    #startBtn {
      background: #238636;
      color: #fff;
      border: none;
      padding: 15px 30px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      margin-bottom: 15px;
    }
    #chat-container {
      width: 100%;
      max-width: 400px;
      display: none;
      flex-direction: column;
      gap: 10px;
    }
    #chatbox {
      width: 100%;
      height: 260px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg { padding: 8px 12px; border-radius: 6px; max-width: 80%; word-break: break-all; }
    .incoming { background: #21262d; color: #3fb950; align-self: flex-start; }
    .outgoing { background: #1f6feb; color: #ffffff; align-self: flex-end; }
    .input-row { display: flex; gap: 8px; }
    input {
      flex: 1;
      background: #0d1117;
      border: 1px solid #30363d;
      color: #fff;
      padding: 12px;
      border-radius: 6px;
      font-family: monospace;
    }
    #sendBtn {
      background: #1f6feb;
      color: #fff;
      border: none;
      padding: 0 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>ACOUSTIC AIRDROP</h2>
  <div id="status">Standby: Tap Start - v4</div>
  <button id="startBtn" onclick="initAudio()">START AIRDROP</button>

  <div id="meter-container">
    <div class="meter-label">Live Ultrasonic Signal Power:</div>
    <div class="bar-bg"><div id="signal-bar"></div></div>
  </div>

  <div id="chat-container">
    <div id="chatbox"></div>
    <div class="input-row">
      <input id="textInput" type="text" placeholder="Type message (e.g. hi)..." />
      <button id="sendBtn" onclick="sendMessage()">SEND</button>
    </div>
  </div>

  <script>
    // Ultrasonic inaudible band (spaced out by 700Hz to prevent bleed)
    const FREQ_SYNC = 17500;
    const FREQ_0    = 18200;
    const FREQ_1    = 18900;
    const FREQ_STOP = 19600;

    const TONE_MS   = 60;      // 60ms tone burst
    const GAP_MS    = 30;      // 30ms guard silence to kill echo
    const SYMBOL_MS = TONE_MS + GAP_MS; // 90ms total per bit
    const SYNC_MS   = 300;     // 300ms wake-up carrier

    let audioCtx, analyser, dataArray;
    let state = "IDLE";
    let isTransmitting = false;

    async function initAudio() {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
        if (audioCtx.state === 'suspended') await audioCtx.resume();

        const stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false
          }
        });

        const source = audioCtx.createMediaStreamSource(stream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;
        source.connect(analyser);

        dataArray = new Uint8Array(analyser.frequencyBinCount);

        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('meter-container').style.display = 'block';
        document.getElementById('chat-container').style.display = 'flex';
        document.getElementById('status').innerText = "Status: Listening silently...";

        requestAnimationFrame(listenLoop);
      } catch (err) {
        alert("Audio Init Error: " + err.message);
      }
    }

    function getMag(freq) {
      const nyquist = audioCtx.sampleRate / 2;
      const bin = Math.round((freq / nyquist) * analyser.frequencyBinCount);
      return (dataArray[bin - 1] + dataArray[bin] + dataArray[bin + 1]) / 3;
    }

    let rxBits = [];
    let rxTimer = null;

    function listenLoop() {
      analyser.getByteFrequencyData(dataArray);

      const syncMag = getMag(FREQ_SYNC);
      const mag0    = getMag(FREQ_0);
      const mag1    = getMag(FREQ_1);
      const stopMag = getMag(FREQ_STOP);
      const maxPower = Math.max(syncMag, mag0, mag1, stopMag);

      // Visual meter updates only when listening (not transmitting)
      const bar = document.getElementById('signal-bar');
      bar.style.width = isTransmitting ? "0%" : Math.min(100, (maxPower / 120) * 100) + "%";

      if (!isTransmitting && state === "IDLE") {
        // Trigger SYNC if clearly louder than data tones
        if (syncMag > 35 && syncMag > (mag0 + 15) && syncMag > (mag1 + 15)) {
          state = "SYNCED";
          document.getElementById('status').innerText = "Status: Receiving signal...";
          rxBits = [];

          // Wait for SYNC to end + sample at the center of the first tone burst
          setTimeout(() => {
            state = "RECEIVING";
            let bitCount = 0;

            rxTimer = setInterval(() => {
              const currentStop = getMag(FREQ_STOP);
              const m0 = getMag(FREQ_0);
              const m1 = getMag(FREQ_1);

              // Stop Tone Check
              if (currentStop > 30 && currentStop > m0 && currentStop > m1) {
                clearInterval(rxTimer);
                finishReceive();
                return;
              }

              // Bit Decision: higher energy wins
              rxBits.push(m1 > m0 ? 1 : 0);
              bitCount++;

              if (bitCount > 100) { // Safety cutoff
                clearInterval(rxTimer);
                finishReceive();
              }
            }, SYMBOL_MS);
          }, SYNC_MS + 25);
        }
      }

      requestAnimationFrame(listenLoop);
    }

    function finishReceive() {
      state = "IDLE";
      document.getElementById('status').innerText = "Status: Listening silently...";

      let binStr = rxBits.join('');
      let text = "";
      for (let i = 0; i + 8 <= binStr.length; i += 8) {
        let byte = binStr.substr(i, 8);
        let code = parseInt(byte, 2);
        if (code >= 32 && code <= 126) {
          text += String.fromCharCode(code);
        }
      }

      if (text.length > 0) {
        appendChat(text, 'incoming');
      }
    }

    function appendChat(text, type) {
      const box = document.getElementById('chatbox');
      const div = document.createElement('div');
      div.className = `msg ${type}`;
      div.innerText = (type === 'outgoing' ? 'You: ' : 'Remote: ') + text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    // --- TRANSMITTER ---
    function sendMessage() {
      const input = document.getElementById('textInput');
      const text = input.value.trim();
      if (!text || isTransmitting) return;

      input.value = "";
      appendChat(text, 'outgoing');
      isTransmitting = true;
      document.getElementById('status').innerText = "Status: Transmitting silently...";

      let bits = [];
      for (let i = 0; i < text.length; i++) {
        let b = text.charCodeAt(i).toString(2).padStart(8, '0');
        for (let char of b) bits.push(parseInt(char));
      }

      const sampleRate = audioCtx.sampleRate;
      const syncSamples  = Math.floor(sampleRate * (SYNC_MS / 1000));
      const toneSamples  = Math.floor(sampleRate * (TONE_MS / 1000));
      const gapSamples   = Math.floor(sampleRate * (GAP_MS / 1000));
      const stopSamples  = Math.floor(sampleRate * (0.15));

      const totalSamples = syncSamples + (bits.length * (toneSamples + gapSamples)) + stopSamples;
      const buffer = audioCtx.createBuffer(1, totalSamples, sampleRate);
      const data = buffer.getChannelData(0);

      let offset = 0;
      function appendTone(freq, numSamples) {
        const ramp = Math.min(80, Math.floor(numSamples * 0.1));
        for (let i = 0; i < numSamples; i++) {
          let env = 1;
          if (i < ramp) env = i / ramp;
          else if (i > numSamples - ramp) env = (numSamples - i) / ramp;
          data[offset + i] = 0.9 * env * Math.sin(2 * Math.PI * freq * (i / sampleRate));
        }
        offset += numSamples;
      }

      function appendSilence(numSamples) {
        offset += numSamples; // buffer is already 0.0
      }

      // 1. Play Sync Tone
      appendTone(FREQ_SYNC, syncSamples);

      // 2. Play each bit followed by a small silence gap
      for (let bit of bits) {
        appendTone(bit === 1 ? FREQ_1 : FREQ_0, toneSamples);
        appendSilence(gapSamples);
      }

      // 3. Play Stop Tone
      appendTone(FREQ_STOP, stopSamples);

      const source = audioCtx.createBufferSource();
      source.buffer = buffer;
      source.connect(audioCtx.destination);
      source.start();

      source.onended = () => {
        setTimeout(() => {
          isTransmitting = false;
          document.getElementById('status').innerText = "Status: Listening silently...";
        }, 200);
      };
    }
  </script>
</body>
</html>
