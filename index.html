<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acoustic AirDrop (Near-Ultrasound)</title>
  <!-- Load ggwave engine: includes FSK modulation + Reed-Solomon Error Correction -->
  <script src="https://cdn.jsdelivr.net/npm/ggwave@0.4.0/ggwave.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #0d1117;
      color: #58a6ff;
      font-family: monospace;
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h2 { color: #f0f6fc; margin: 10px 0; }
    #status { color: #8b949e; margin-bottom: 12px; font-size: 13px; text-align: center; }
    
    #startBtn {
      background: #238636;
      color: #fff;
      border: none;
      padding: 15px 30px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      margin-bottom: 15px;
    }

    #chat-container {
      width: 100%;
      max-width: 420px;
      display: none;
      flex-direction: column;
      gap: 10px;
    }
    #chatbox {
      width: 100%;
      height: 280px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg { padding: 8px 12px; border-radius: 6px; max-width: 85%; font-size: 14px; word-break: break-all; }
    .incoming { background: #21262d; color: #3fb950; align-self: flex-start; }
    .outgoing { background: #1f6feb; color: #ffffff; align-self: flex-end; }
    
    .input-row { display: flex; gap: 8px; }
    input {
      flex: 1;
      background: #0d1117;
      border: 1px solid #30363d;
      color: #fff;
      padding: 12px;
      border-radius: 6px;
      font-family: monospace;
    }
    #sendBtn {
      background: #1f6feb;
      color: #fff;
      border: none;
      padding: 0 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    #sendBtn:disabled { background: #30363d; cursor: not-allowed; }
  </style>
</head>
<body>

  <h2>ACOUSTIC AIRDROP</h2>
  <div id="status">Standby: Tap Start to enable microphone and speaker</div>
  <button id="startBtn" onclick="initAcousticChat()">START CHAT</button>

  <div id="chat-container">
    <div id="chatbox"></div>
    <div class="input-row">
      <input id="textInput" type="text" placeholder="Type message..." onkeydown="if(event.key==='Enter') sendMessage()" />
      <button id="sendBtn" onclick="sendMessage()">SEND</button>
    </div>
  </div>

  <script>
    let ggwaveInstance = null;
    let audioCtx = null;
    let isTransmitting = false;

    async function initAcousticChat() {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass({ sampleRate: 48000 });
        if (audioCtx.state === 'suspended') await audioCtx.resume();

        // 1. Initialize ggwave WebAssembly instance
        const factory = await ggwave_factory();
        ggwaveInstance = factory.ggwave;
        ggwaveInstance.init({
          sampleRateInp: audioCtx.sampleRate,
          sampleRateOut: audioCtx.sampleRate
        });

        // 2. Request clean microphone input without OS speech filters
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: false,
            autoGainControl: false,
            noiseSuppression: false
          }
        });

        // 3. Connect microphone to ScriptProcessor (continuous sample ingestion)
        const source = audioCtx.createMediaStreamSource(stream);
        const recorder = audioCtx.createScriptProcessor(2048, 1, 1);

        recorder.onaudioprocess = (e) => {
          if (isTransmitting || !ggwaveInstance) return;
          const inputData = e.inputBuffer.getChannelData(0);

          // Decode raw audio continuous stream
          const res = ggwaveInstance.decode(inputData);
          if (res && res.length > 0) {
            appendChat(res, 'incoming');
          }
        };

        source.connect(recorder);
        recorder.connect(audioCtx.destination); // Required by web audio to keep the pipe alive

        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('chat-container').style.display = 'flex';
        document.getElementById('status').innerText = "Status: Listening (Near-Ultrasound band)...";
      } catch (err) {
        alert("Initialization error: " + err.message);
      }
    }

    function sendMessage() {
      const input = document.getElementById('textInput');
      const text = input.value.trim();
      if (!text || isTransmitting || !ggwaveInstance) return;

      input.value = "";
      appendChat(text, 'outgoing');
      
      const sendBtn = document.getElementById('sendBtn');
      sendBtn.disabled = true;
      isTransmitting = true;
      document.getElementById('status').innerText = "Status: Sending silent acoustic packet...";

      // GGWAVE_TX_PROTOCOL_ULTRASOUND_FAST:
      // Uses near-ultrasound (15kHz - 17kHz). Inaudible to most adults,
      // yet within hardware capabilities of modern phone mics & speakers.
      const protocolId = ggwaveInstance.TxProtocolId.GGWAVE_TX_PROTOCOL_ULTRASOUND_FAST;
      const volume = 25; // 0 to 100
      const waveform = ggwaveInstance.encode(text, protocolId, volume);

      if (!waveform) {
        alert("Encoding failed");
        isTransmitting = false;
        sendBtn.disabled = false;
        return;
      }

      // Convert Int16Array from ggwave to Web Audio Float32Array
      const floatData = new Float32Array(waveform.length);
      for (let i = 0; i < waveform.length; i++) {
        floatData[i] = waveform[i] / 32768.0;
      }

      // Play audio packet
      const audioBuffer = audioCtx.createBuffer(1, floatData.length, audioCtx.sampleRate);
      audioBuffer.copyToChannel(floatData, 0);

      const bufferSource = audioCtx.createBufferSource();
      bufferSource.buffer = audioBuffer;
      bufferSource.connect(audioCtx.destination);

      bufferSource.onended = () => {
        // Small guard time to let room reverberations decay
        setTimeout(() => {
          isTransmitting = false;
          sendBtn.disabled = false;
          document.getElementById('status').innerText = "Status: Listening (Near-Ultrasound band)...";
        }, 150);
      };

      bufferSource.start();
    }

    function appendChat(text, type) {
      const box = document.getElementById('chatbox');
      const div = document.createElement('div');
      div.className = `msg ${type}`;
      div.innerText = (type === 'outgoing' ? 'You: ' : 'Remote: ') + text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }
  </script>
</body>
</html>
