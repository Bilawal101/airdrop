<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acoustic AirDrop</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #0d1117;
      color: #58a6ff;
      font-family: monospace;
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h2 { color: #f0f6fc; margin: 10px 0; }
    #status { color: #8b949e; margin-bottom: 10px; font-size: 13px; text-align: center; }
    
    /* Live Signal Meter */
    #meter-container {
      width: 100%;
      max-width: 400px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 15px;
      display: none;
    }
    .meter-label { font-size: 11px; color: #8b949e; margin-bottom: 4px; }
    .bar-bg { background: #21262d; height: 10px; border-radius: 5px; overflow: hidden; }
    #signal-bar { width: 0%; height: 100%; background: #3fb950; transition: width 0.05s; }

    #startBtn {
      background: #238636;
      color: #fff;
      border: none;
      padding: 15px 30px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      margin-bottom: 15px;
    }
    #chat-container {
      width: 100%;
      max-width: 400px;
      display: none;
      flex-direction: column;
      gap: 10px;
    }
    #chatbox {
      width: 100%;
      height: 250px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg { padding: 8px 12px; border-radius: 6px; max-width: 80%; word-break: break-all; }
    .incoming { background: #21262d; color: #3fb950; align-self: flex-start; }
    .outgoing { background: #1f6feb; color: #ffffff; align-self: flex-end; }
    .input-row { display: flex; gap: 8px; }
    input {
      flex: 1;
      background: #0d1117;
      border: 1px solid #30363d;
      color: #fff;
      padding: 12px;
      border-radius: 6px;
      font-family: monospace;
    }
    #sendBtn {
      background: #1f6feb;
      color: #fff;
      border: none;
      padding: 0 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>ACOUSTIC AIRDROP</h2>
  <div id="status">Standby: Tap Start to activate mic & audio - v2</div>
  <button id="startBtn" onclick="initAudio()">START AIRDROP</button>

  <div id="meter-container">
    <div class="meter-label">Live Ultrasonic Signal Strength:</div>
    <div class="bar-bg"><div id="signal-bar"></div></div>
  </div>

  <div id="chat-container">
    <div id="chatbox"></div>
    <div class="input-row">
      <input id="textInput" type="text" placeholder="Type message..." />
      <button id="sendBtn" onclick="sendMessage()">SEND</button>
    </div>
  </div>

  <script>
    // Ultrasonic Frequencies
    const FREQ_SYNC = 17500;
    const FREQ_0 = 18600;
    const FREQ_1 = 19600;
    const FREQ_STOP = 20600;

    const BIT_MS = 80;        // 80ms per bit for 100% reliability
    const SYNC_MS = 300;      // 300ms wake-up chirp
    const THRESHOLD = 35;     // Sensitivity threshold (out of 255)

    let audioCtx, analyser, dataArray;
    let state = "IDLE";
    let bitStream = [];
    let isTransmitting = false;

    async function initAudio() {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
        if (audioCtx.state === 'suspended') await audioCtx.resume();

        // Disable browser speech filtering so ultrasound isn't deleted!
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false
          }
        });

        const source = audioCtx.createMediaStreamSource(stream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;
        source.connect(analyser);

        dataArray = new Uint8Array(analyser.frequencyBinCount);

        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('meter-container').style.display = 'block';
        document.getElementById('chat-container').style.display = 'flex';
        document.getElementById('status').innerText = "Status: Listening for silent ultrasound...";

        requestAnimationFrame(updateLoop);
      } catch (err) {
        alert("Audio Init Error: " + err.message);
      }
    }

    function getMag(freq) {
      const nyquist = audioCtx.sampleRate / 2;
      const bin = Math.round((freq / nyquist) * analyser.frequencyBinCount);
      return (dataArray[bin - 1] + dataArray[bin] + dataArray[bin + 1]) / 3;
    }

    function updateLoop() {
      analyser.getByteFrequencyData(dataArray);

      const syncMag = getMag(FREQ_SYNC);
      const stopMag = getMag(FREQ_STOP);
      const maxUltrasound = Math.max(syncMag, getMag(FREQ_0), getMag(FREQ_1), stopMag);

      // Update live visual meter
      const bar = document.getElementById('signal-bar');
      bar.style.width = Math.min(100, (maxUltrasound / 150) * 100) + "%";

      if (!isTransmitting) {
        if (state === "IDLE" && syncMag > THRESHOLD) {
          state = "SYNCED";
          document.getElementById('status').innerText = "Status: Receiving signal...";
          bitStream = [];

          // Wait for SYNC tone to finish + reach center of 1st bit
          setTimeout(() => {
            state = "RECEIVING";
            startSampling();
          }, SYNC_MS + (BIT_MS / 2));
        }
      }

      requestAnimationFrame(updateLoop);
    }

    function startSampling() {
      const timer = setInterval(() => {
        const stopMag = getMag(FREQ_STOP);
        const mag0 = getMag(FREQ_0);
        const mag1 = getMag(FREQ_1);

        if (stopMag > THRESHOLD && stopMag > mag0 && stopMag > mag1) {
          clearInterval(timer);
          finishMessage();
          return;
        }

        bitStream.push(mag1 > mag0 ? 1 : 0);
      }, BIT_MS);
    }

    function finishMessage() {
      state = "IDLE";
      document.getElementById('status').innerText = "Status: Listening for silent ultrasound...";

      let binary = bitStream.join('');
      let text = "";
      for (let i = 0; i + 8 <= binary.length; i += 8) {
        text += String.fromCharCode(parseInt(binary.substr(i, 8), 2));
      }

      if (text.length > 0) {
        appendChat(text, 'incoming');
      }
    }

    function appendChat(text, type) {
      const box = document.getElementById('chatbox');
      const div = document.createElement('div');
      div.className = `msg ${type}`;
      div.innerText = (type === 'outgoing' ? 'You: ' : 'Remote: ') + text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    // --- ONE CONTINUOUS SOUND BUFFER TRANSMITTER ---
    function sendMessage() {
      const input = document.getElementById('textInput');
      const text = input.value.trim();
      if (!text || isTransmitting) return;

      input.value = "";
      appendChat(text, 'outgoing');
      isTransmitting = true;
      document.getElementById('status').innerText = "Status: Transmitting silently...";

      let bits = [];
      for (let i = 0; i < text.length; i++) {
        let b = text.charCodeAt(i).toString(2).padStart(8, '0');
        for (let char of b) bits.push(parseInt(char));
      }

      const sampleRate = audioCtx.sampleRate;
      const syncSamples = Math.floor(sampleRate * (SYNC_MS / 1000));
      const bitSamples = Math.floor(sampleRate * (BIT_MS / 1000));
      const stopSamples = Math.floor(sampleRate * (150 / 1000));
      const totalSamples = syncSamples + (bits.length * bitSamples) + stopSamples;

      // Create a single monolithic audio buffer
      const buffer = audioCtx.createBuffer(1, totalSamples, sampleRate);
      const data = buffer.getChannelData(0);

      // Helper to write smooth sine tones
      let offset = 0;
      function writeTone(freq, numSamples) {
        const ramp = Math.min(100, Math.floor(numSamples * 0.1));
        for (let i = 0; i < numSamples; i++) {
          let env = 1;
          if (i < ramp) env = i / ramp;
          else if (i > numSamples - ramp) env = (numSamples - i) / ramp;
          data[offset + i] = 0.8 * env * Math.sin(2 * Math.PI * freq * (i / sampleRate));
        }
        offset += numSamples;
      }

      // 1. Write Sync tone
      writeTone(FREQ_SYNC, syncSamples);

      // 2. Write all Data bits continuously
      for (let bit of bits) {
        writeTone(bit === 1 ? FREQ_1 : FREQ_0, bitSamples);
      }

      // 3. Write Stop tone
      writeTone(FREQ_STOP, stopSamples);

      // Play the full audio buffer in one shot
      const source = audioCtx.createBufferSource();
      source.buffer = buffer;
      source.connect(audioCtx.destination);
      source.start();

      source.onended = () => {
        setTimeout(() => {
          isTransmitting = false;
          document.getElementById('status').innerText = "Status: Listening for silent ultrasound...";
        }, 300);
      };
    }
  </script>
</body>
</html>
