<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acoustic AirDrop</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #0d1117;
      color: #58a6ff;
      font-family: monospace;
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h2 { color: #f0f6fc; margin: 10px 0; text-align: center; }
    #status { color: #8b949e; margin-bottom: 15px; font-size: 14px; }
    #startBtn {
      background: #238636;
      color: #fff;
      border: none;
      padding: 15px 30px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      margin-bottom: 15px;
    }
    #chat-container {
      width: 100%;
      max-width: 450px;
      display: none;
      flex-direction: column;
      gap: 10px;
    }
    #chatbox {
      width: 100%;
      height: 280px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg {
      padding: 8px 12px;
      border-radius: 6px;
      max-width: 80%;
      word-break: break-all;
    }
    .incoming { background: #21262d; color: #3fb950; align-self: flex-start; }
    .outgoing { background: #1f6feb; color: #ffffff; align-self: flex-end; }
    .input-row { display: flex; gap: 8px; }
    input {
      flex: 1;
      background: #0d1117;
      border: 1px solid #30363d;
      color: #fff;
      padding: 12px;
      border-radius: 6px;
      font-family: monospace;
    }
    #sendBtn {
      background: #1f6feb;
      color: #fff;
      border: none;
      padding: 0 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>ACOUSTIC AIRDROP</h2>
  <div id="status">Standby: Tap to initialize Audio</div>
  <button id="startBtn" onclick="initAudio()">START AIRDROP</button>

  <div id="chat-container">
    <div id="chatbox"></div>
    <div class="input-row">
      <input id="textInput" type="text" placeholder="Type secret message..." />
      <button id="sendBtn" onclick="sendMessage()">SEND</button>
    </div>
  </div>

  <script>
   // Communication Frequencies (Hz)
    const PREAMBLE_FREQ = 17500;
    const FREQ_0 = 18500;
    const FREQ_1 = 19500;
    const STOP_FREQ = 20500;

    const BIT_MS = 60;
    const PREAMBLE_MS = 250;
    const STOP_MS = 150;

    let audioCtx, analyser, dataArray;
    let state = "IDLE";
    let bitStream = [];
    let sampleTimer = null;
    let isTransmitting = false;

    async function initAudio() {
      const statusEl = document.getElementById('status');
      
      try {
        // 1. Check for HTTPS / Secure Context
        if (!window.isSecureContext && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
          throw new Error("SECURITY ERROR: Mobile browsers disable the mic unless the URL is HTTPS! See below for the fix.");
        }

        // 2. Check for getUserMedia support
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error("Microphone API not supported or blocked on this page context.");
        }

        statusEl.innerText = "Requesting microphone permission...";

        // 3. Initialize AudioContext (Handles iOS and Android)
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
        if (audioCtx.state === 'suspended') {
          await audioCtx.resume();
        }

        // 4. Request mic stream
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        const source = audioCtx.createMediaStreamSource(stream);

        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;
        source.connect(analyser);

        dataArray = new Uint8Array(analyser.frequencyBinCount);

        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('chat-container').style.display = 'flex';
        statusEl.innerText = "Status: Listening silently for ultrasound...";
        statusEl.style.color = "#3fb950";

        requestAnimationFrame(listenLoop);

      } catch (err) {
        statusEl.innerText = "ERROR: " + err.message;
        statusEl.style.color = "#ff7b72";
        alert(err.message);
      }
    }

    // --- RECEIVER LOGIC ---
    function getMag(freq) {
      const nyquist = audioCtx.sampleRate / 2;
      const bin = Math.round((freq / nyquist) * analyser.frequencyBinCount);
      return (dataArray[bin - 1] + dataArray[bin] + dataArray[bin + 1]) / 3;
    }

    function listenLoop() {
      analyser.getByteFrequencyData(dataArray);

      if (!isTransmitting) {
        const preambleMag = getMag(PREAMBLE_FREQ);
        const stopMag = getMag(STOP_FREQ);

        if (state === "IDLE" && preambleMag > 130) {
          state = "PREAMBLE_DETECTED";
          document.getElementById('status').innerText = "Status: Receiving incoming signal...";
          bitStream = [];

          setTimeout(() => {
            state = "RECEIVING";
            sampleTimer = setInterval(sampleBit, BIT_MS);
          }, PREAMBLE_MS + 60);
        } else if (state === "RECEIVING" && stopMag > 130) {
          finishReceiving();
        }
      }

      requestAnimationFrame(listenLoop);
    }

    function sampleBit() {
      const bit = getMag(FREQ_1) > getMag(FREQ_0) ? 1 : 0;
      bitStream.push(bit);
    }

    function finishReceiving() {
      clearInterval(sampleTimer);
      state = "IDLE";
      document.getElementById('status').innerText = "Status: Listening silently...";

      let binStr = bitStream.join('');
      let text = "";
      for (let i = 0; i + 8 <= binStr.length; i += 8) {
        text += String.fromCharCode(parseInt(binStr.substr(i, 8), 2));
      }

      if (text.length > 0) {
        appendChat(text, 'incoming');
      }
    }

    // --- TRANSMITTER LOGIC ---
    function appendChat(text, type) {
      const box = document.getElementById('chatbox');
      const div = document.createElement('div');
      div.className = `msg ${type}`;
      div.innerText = (type === 'outgoing' ? 'You: ' : 'Remote: ') + text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function generateToneBuffer(freq, durationMs) {
      const sampleRate = audioCtx.sampleRate;
      const samples = Math.floor(sampleRate * (durationMs / 1000));
      const buffer = audioCtx.createBuffer(1, samples, sampleRate);
      const data = buffer.getChannelData(0);
      const rampLen = Math.floor(sampleRate * 0.005);

      for (let i = 0; i < samples; i++) {
        let env = 1;
        if (i < rampLen) env = 0.5 * (1 - Math.cos((Math.PI * i) / rampLen));
        else if (i > samples - rampLen) env = 0.5 * (1 - Math.cos((Math.PI * (samples - i)) / rampLen));
        data[i] = 0.7 * env * Math.sin(2 * Math.PI * freq * (i / sampleRate));
      }
      return buffer;
    }

    async function sendMessage() {
      const input = document.getElementById('textInput');
      const text = input.value.trim();
      if (!text || isTransmitting) return;

      input.value = "";
      appendChat(text, 'outgoing');
      isTransmitting = true;
      document.getElementById('status').innerText = "Status: Transmitting silently...";

      let bits = [];
      for (let i = 0; i < text.length; i++) {
        let b = text.charCodeAt(i).toString(2).padStart(8, '0');
        for (let char of b) bits.push(parseInt(char));
      }

      let startTime = audioCtx.currentTime + 0.05;

      function playBuffer(buf, time) {
        const src = audioCtx.createBufferSource();
        src.buffer = buf;
        src.connect(audioCtx.destination);
        src.start(time);
      }

      playBuffer(generateToneBuffer(PREAMBLE_FREQ, PREAMBLE_MS), startTime);
      startTime += (PREAMBLE_MS + 30) / 1000;

      for (let bit of bits) {
        const freq = (bit === 1) ? FREQ_1 : FREQ_0;
        playBuffer(generateToneBuffer(freq, BIT_MS), startTime);
        startTime += BIT_MS / 1000;
      }

      playBuffer(generateToneBuffer(STOP_FREQ, STOP_MS), startTime);
      startTime += STOP_MS / 1000;

      const totalWait = (startTime - audioCtx.currentTime) * 1000;
      setTimeout(() => {
        isTransmitting = false;
        document.getElementById('status').innerText = "Status: Listening silently...";
      }, totalWait + 200);
    }
  </script>
</body>
</html>
